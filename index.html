<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>健康リブート</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#f6f7f4;color:#333}
h1{font-size:28px;margin:0 0 5px}.sub{color:#777;margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000010}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weektitle{text-align:center;font-weight:700;flex:1}
.navbtn,.action{border:1px solid #ccc;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
.row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;margin:8px 0}
.date{font-weight:600}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 4px;font-size:18px;cursor:pointer}
.btn.active{background:#e8f1e8;border-color:#9ab99a}.btn.dash{background:#eee}
.labels{display:grid;grid-template-columns:72px 1fr;gap:8px;margin-top:14px}
.labels .checks{font-size:13px;color:#777;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.primary{background:#333;color:#fff;border:0;border-radius:10px;padding:11px 15px;cursor:pointer}
pre{white-space:pre-wrap;background:#f2f3f0;padding:14px;border-radius:10px;font-size:13px;overflow:auto}
.hint{font-size:13px;color:#777;margin-top:10px}
@media(max-width:560px){body{padding:14px}.btn{font-size:16px;padding:9px 2px}}
</style>
</head>
<body>
<h1>🌿 健康リブート</h1>
<div class="sub">毎日30秒。1週間まとめて、ちゃぴこにレビュー。</div>
<div class="card">
  <div class="weeknav">
    <button class="navbtn" onclick="moveWeek(-1)">← 前週</button>
    <div class="weektitle" id="weekLabel"></div>
    <button class="navbtn" onclick="moveWeek(1)">次週 →</button>
  </div>
  <div class="labels"><div></div><div class="checks"><span>🐟</span><span>🚶</span><span>🍺</span><span>🩺</span><span>🍽️</span></div></div>
  <div id="days"></div>
  <div class="actions">
    <button class="primary" onclick="generateMD()">📄 週間MDを生成</button>
    <button class="action" onclick="copyMD()">📋 コピー</button>
    <button class="action" onclick="downloadMD()">⬇️ MD保存</button>
  </div>
  <div class="hint">入力内容はこのブラウザに自動保存されます。週が変わっても前週の記録は残ります。</div>
</div>
<div class="card">
  <b>項目</b>
  <div style="margin-top:10px;line-height:1.9">🐟 魚を食べた　　🚶 歩いた・運動した<br>🍺 飲酒　　　　　🩺 血圧を測った<br>🍽️ 食生活を意識できた</div>
</div>
<div class="card">
  <b>📝 今週のひとこと</b>
  <div class="hint">体調・食事・気づいたことなど、ちゃぴこに伝えたいことを自由に。</div>
  <textarea id="memo" placeholder="例：外食が多かった。2年前の写真より太った気がするので食生活を見直したい。" style="width:100%;box-sizing:border-box;min-height:90px;margin-top:10px;border:1px solid #ddd;border-radius:10px;padding:10px;font:inherit;resize:vertical;"></textarea>
</div>
<div class="card"><b>生成されるMD</b><pre id="output">「週間MDを生成」を押してください。</pre></div>
<script>
const items=[["🐟","魚を食べた"],["🚶","歩いた・運動した"],["🍺","飲酒"],["🩺","血圧を測った"],["🍽️","食生活を意識できた"]];
let data=JSON.parse(localStorage.getItem("healthRebootV2")||"{}");
let selectedWeek=startOfWeek(new Date());
function key(d){return d.toISOString().slice(0,10)}
function fmt(d){return d.getMonth()+1+"/"+d.getDate()}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function weekKey(){return key(selectedWeek)}
function render(){
 const end=new Date(selectedWeek);end.setDate(end.getDate()+6);
 document.getElementById("weekLabel").textContent=selectedWeek.getFullYear()+"年 "+fmt(selectedWeek)+"〜"+fmt(end);
 const box=document.getElementById("days");box.innerHTML="";
 for(let i=0;i<7;i++){const d=new Date(selectedWeek);d.setDate(d.getDate()+i);const k=key(d);if(!data[k])data[k]={};
  const row=document.createElement("div");row.className="row";row.innerHTML='<div class="date">'+fmt(d)+'</div><div class="checks"></div>';const grid=row.querySelector(".checks");
  items.forEach(([icon,name],idx)=>{const b=document.createElement("button");const v=data[k][idx]||"";b.className="btn";b.textContent=icon;if(v==="○"||v==="×")b.classList.add("active");if(v==="－")b.classList.add("dash","active");b.title=name+": "+(v||"未入力");b.onclick=()=>cycle(k,idx);grid.appendChild(b)});box.appendChild(row)}
 loadMemo();
}
function cycle(k,idx){const v=data[k]?.[idx]||"";if(!data[k])data[k]={};data[k][idx]=v===""?"○":v==="○"?"×":v==="×"?"－":"";localStorage.setItem("healthRebootV2",JSON.stringify(data));render()}
function moveWeek(n){selectedWeek=new Date(selectedWeek);selectedWeek.setDate(selectedWeek.getDate()+n*7);document.getElementById("output").textContent="「週間MDを生成」を押してください。";render()}
function getCounts(week){const counts=[0,0,0,0,0];for(let i=0;i<7;i++){const d=new Date(week);d.setDate(d.getDate()+i);const k=key(d);for(let j=0;j<5;j++)if(data[k]?.[j]==="○")counts[j]++}return counts}
function saveMemo(){const memo=document.getElementById("memo");if(memo)localStorage.setItem("healthRebootMemo_"+weekKey(),memo.value)}
function loadMemo(){const memo=document.getElementById("memo");if(memo)memo.value=localStorage.getItem("healthRebootMemo_"+weekKey())||""}
function mdText(){
 saveMemo();const end=new Date(selectedWeek);end.setDate(end.getDate()+6);const previous=new Date(selectedWeek);previous.setDate(previous.getDate()-7);const counts=getCounts(selectedWeek),prevCounts=getCounts(previous);const memo=localStorage.getItem("healthRebootMemo_"+weekKey())||"";
 let s="# 健康リブート週間\n\n"+selectedWeek.getFullYear()+"/"+fmt(selectedWeek)+"〜"+fmt(end)+"\n\n";
 s+="| 日付 | 🐟 | 🚶 | 🍺 | 🩺 | 🍽️ |\n|---|---|---|---|---|---|\n";
 for(let i=0;i<7;i++){const d=new Date(selectedWeek);d.setDate(d.getDate()+i);const k=key(d);const vals=[0,1,2,3,4].map(j=>data[k]?.[j]||"");s+="| "+fmt(d)+" | "+vals.join(" | ")+" |\n"}
 s+="\n## 週間集計\n\n| 項目 | 今週 | 先週 | 差 |\n|---|---:|---:|---:|\n";
 const names=["🐟 魚","🚶 運動","🍺 飲酒","🩺 血圧","🍽️ 食生活"];
 for(let j=0;j<5;j++){const diff=counts[j]-prevCounts[j],sign=diff>0?"+":"";s+="| "+names[j]+" | "+counts[j]+"日 | "+prevCounts[j]+"日 | "+sign+diff+" |\n"}
 s+="\n## 📝 今週のひとこと\n\n"+(memo.trim()?memo.trim():"（なし）")+"\n";
 s+="\n## ちゃぴこレビュー用\n\nこの1週間の健康リブートをレビューしてください。\n先週との変化、できたこと、気になる傾向、来週に意識することを簡潔にコメントしてください。\n";
 return s;
}
function generateMD(){document.getElementById("output").textContent=mdText()}
async function copyMD(){const t=mdText();try{await navigator.clipboard.writeText(t);document.getElementById("output").textContent=t;alert("MDをコピーしました")}catch(e){document.getElementById("output").textContent=t;alert("コピーできませんでした。表示されたMDをコピーしてください。")}}
function downloadMD(){const t=mdText(),blob=new Blob([t],{type:"text/markdown;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="健康リブート_"+key(selectedWeek)+".md";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
render();document.getElementById("memo").addEventListener("input",saveMemo);
</script>
</body>
</html>
